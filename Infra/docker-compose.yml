version: '3.8'

services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pothole_backend_api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: pothole_user
      DB_PASSWORD: super_secret_password
      DB_NAME: pothole_db
      MINIO_ENDPOINT: minio_storage:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password_123
      MINIO_BUCKET: reports-media
      NODE_ENV: development
    depends_on:
      - postgres_db
      - minio_storage

  postgres_db:
    image: postgres:15-alpine
    container_name: pothole_postgres_db
    environment:
      POSTGRES_USER: pothole_user
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: pothole_db
    volumes:
      - pothole_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio_storage:
    image: minio/minio:latest
    container_name: pothole_minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pothole_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10