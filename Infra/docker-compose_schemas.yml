version: '3.8'

services:

  # 1. DB
  mysql_shared_db:
    image: mysql:8.0
    container_name: pothole_mysql_shared_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: shared_root_password
    volumes:
      - mysql_shared_data:/var/lib/mysql

  # =================================================================
  # 2. REPORTS SERVICE (Pripojenie na ZDIE¼ANÚ DB, ale s reports_schema)
  # =================================================================
  reports-service:
    build: 
      context: ./services/reports
      dockerfile: Dockerfile
    container_name: pothole_reports_service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql_shared_db
      DB_PORT: 3306
      DB_USER: shared_db_user
      DB_PASSWORD: shared_db_password
      DB_NAME: reports_schema
      
      MINIO_ENDPOINT: minio_storage:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password_123
      MINIO_BUCKET: reports-media
    depends_on:
      - mysql_shared_db
      - minio_storage
      
  # =================================================================
  # 3. USERS SERVICE (Pripojenie na ZDIE¼ANÚ DB, ale s users_schema)
  # =================================================================
  users-service:
    build: 
      context: ./services/users
      dockerfile: Dockerfile
    container_name: pothole_users_service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql_shared_db
      DB_PORT: 3306
      DB_USER: shared_db_user
      DB_PASSWORD: shared_db_password
      DB_NAME: users_schema
    depends_on:
      - mysql_shared_db
      
  # =================================================================
  # 4. ADMIN SERVICE (Pripojenie na ZDIE¼ANÚ DB, ale s admin_schema)
  # =================================================================
  admin-service:
    build: 
      context: ./services/admin
      dockerfile: Dockerfile
    container_name: pothole_admin_service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql_shared_db
      DB_PORT: 3306
      DB_USER: shared_db_user
      DB_PASSWORD: shared_db_password
      DB_NAME: admin_schema
    depends_on:
      - mysql_shared_db
      
  # 5. ÚLOŽISKO SÚBOROV (MinIO)
  minio_storage:
    image: minio/minio:latest
    container_name: pothole_minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pothole_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

# Definovanie úložísk
volumes:
  mysql_shared_data:
  pothole_minio_data: